<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container with rounded corners & border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#cyanNeon)" stroke-width="8" stroke-opacity="0.4" />

  <!-- Ambient inner glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" filter="url(#neonGlow)" opacity="0.4" />

  <!-- Geometric M Monogram Path for MKA -->
  <path
    d="M 128 384 L 128 148 L 256 280 L 384 148 L 384 384 M 184 384 L 184 250 L 256 324 L 328 250 L 328 384"
    fill="none"
    stroke="url(#cyanNeon)"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Subtle Cyber Dot Accent -->
  <circle cx="256" cy="384" r="14" fill="#22d3ee" filter="url(#neonGlow)" />
</svg>
